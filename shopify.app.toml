client_id = "5b0a5533f352fe05ee426a0af44f2b70"
name = "custom-price-calculate"
application_url = "https://fdb7-2400-c600-5404-7a45-9419-e53e-16ea-e29d.ngrok-free.app"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,read_products,read_metaobjects,write_metaobjects,write_metaobject_definitions,write_orders,write_customers,write_draft_orders,write_files,read_files,read_draft_orders"

[auth]
redirect_urls = [ "https://fdb7-2400-c600-5404-7a45-9419-e53e-16ea-e29d.ngrok-free.app/api/auth" ]


[app_proxy]
url = "https://fdb7-2400-c600-5404-7a45-9419-e53e-16ea-e29d.ngrok-free.app" 
subpath = "customprice"
prefix = "apps"